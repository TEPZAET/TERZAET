name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug
      - run: mv app/build/outputs/apk/debug/app-debug.apk "TERZAET-${GITHUB_REF_NAME#v}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |-
            Будь всегда в сети с TERZAET. Новый вид VPN.
          files: TERZAET-*.apk
          make_latest: true
