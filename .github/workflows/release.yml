name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug
      - run: mv app/build/outputs/apk/debug/app-debug.apk TERZAET-1.0.3.apk
      - uses: softprops/action-gh-release@v2
        with:
          name: v1.0.3
          body: |-
            Визуал и стабильность🤍
            TERZAET — независимый неофициальный форк OpenFluxAndroid/OpenFlux.
          files: TERZAET-1.0.3.apk
          make_latest: true
